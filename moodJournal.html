<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mood Tracker Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📝  Mood Tracker</h1>

  <section class="log-entry vibe-happy">
    <h2>Super Productive!</h2>
    <p>Got a lot done today — finished my assignments and even took a walk outside!</p>
    <button class="react-btn">❤️ React</button>
  </section>

  <section class="log-entry vibe-neutral">
    <h2>Nothing Special</h2>
    <p>Kind of a chill day. Not much happened, but that’s okay sometimes.</p>
    <button class="react-btn">😄 React</button>
  </section>

  <section class="log-entry vibe-low">
    <h2>A Bit Off</h2>
    <p>Felt low-energy and out of it today. Hoping for a brighter tomorrow.</p>
    <button class="react-btn">👍 React</button>
  </section>

</body>
</html>
